<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="S&E is a Vietnamese restaurant offering delicious food and drinks in a cozy atmosphere.">
    <meta name="keywords" content="sit and eat, restaurant, food, drinks, menu, booking, vietnamese">
    <meta name="author" content="S&E">
    <title>S&E | Menu</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" type="image/x-icon" sizes="64x64" href="assets/images/favicon.ico">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Navigation bar -->
    <nav id="navbar" class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="/assets/images/S&E-logo.webp" alt="S&E Logo" class="navLogo">
            </a>
            <h1 class="navTitle">Sit & Eat</h1>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse text-end" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="menu.html"><i class="fa-solid fa-rectangle-list"></i>Menu</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="book.html"><i class="fa-solid fa-calendar-days"></i>Book</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- Header section -->
    <header>
        <div class="container text-center">
                <h1 class="headerTitle">Sit & Eat</h1>
                <div class="row justify-content-around">
                    <div class="col-12 col-md-6 col-lg-8 mt-4 align-self-center order-md-1">
                        <p>Find below all we have to offer on our menu, if you find something you like you can book a table online!</p>
                    </div>
                </div>
        </div>
    </header>
    <!-- Main section -->
    <main>
        <!-- Menu section -->
         <div class="container">
            <div id="carouselExampleIndicators" class="carousel carousel-dark slide">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="dark" data-bs-slide-to="0" class="active"
                        aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="dark" data-bs-slide-to="1"
                        aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="dark" data-bs-slide-to="2"
                        aria-label="Slide 3"></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <div class="card" style="width: 18rem;">
                            <img src="..." class="card-img-top" alt="...">
                            <div class="card-body">
                                <h5 class="card-title">Card title</h5>
                                <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card’s
                                    content.</p>
                                <a href="#" class="btn btn-primary">Go somewhere</a>
                            </div>
                        </div>
                    </div>
                    <div class="carousel-item">
                        
                    </div>
                    <div class="carousel-item">
                        
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="dark"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="dark"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
         </div>
    </main>
    <!-- Footer section -->
    <footer id="footer" class="mt-auto">
        <div class="container">
            <div class="row justify-content-evenly text-center">
                <div class="col-3 align-self-center">
                    <p>NMZBOF &#169; 2026</p>
                </div>
                <div class="col-3 align-self-center mt-2">
                    <a href="https://www.facebook.com" target="_blank" rel="noopener" aria-label="Facebook"><i class="fa-brands fa-square-facebook"></i></a>
                </div>
                <div class="col-3 align-self-center mt-2">
                    <a href="https://www.instagram.com" target="_blank" rel="noopener" aria-label="Instagram"><i class="fa-brands fa-square-instagram"></i></a>
                </div>
                <div class="col-3 align-self-center mt-2">
                    <a href="https://www.x.com" target="_blank" rel="noopener" aria-label="Twitter/X"><i class="fa-brands fa-square-x-twitter"></i></a>
                </div>
            </div>
        </div>
    </footer>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- Fontawesome kit -->
    <script src="https://kit.fontawesome.com/68e4433a11.js" crossorigin="anonymous"></script>
</body>
</html>
